<style>
/* Layout: ficha de treino — painel de configuração no topo, abas por dia, linhas de exercício como uma planilha de academia */
:root{
  /* Identidade aprovada: grafite, controles #303030, branco suave, laranja só na ação principal */
  --bg:#141414; --surface:#1e1e1e; --surface-2:#303030; --line:#2a2a2a;
  --fg:#F5F3EE; --muted:#a19d95; --accent:#FF751F; --accent-ink:#141414; --accent-soft:rgba(255,117,31,.14);
  --ok:#5fd08f; --ok-soft:rgba(95,208,143,.14); --warn:#f0b04c; --fig:#e9e6df; --fig-2:#8f8b84; --prop:#4a4a4a;
  --f-display:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:Inter,system-ui,-apple-system,sans-serif;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1;letter-spacing:-.02em}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:700}
.eyebrow{font-size:.85rem;color:var(--muted);font-weight:500}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.sync{font-size:.78rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;align-items:end}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:600;color:var(--muted);}
select,input{font:inherit;font-size:.95rem;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:8px 14px;font-weight:600;font-size:.9rem}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button{border-radius:12px}
button.primary:hover{filter:brightness(1.07)}
button.danger{color:var(--accent);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button.ghost:hover{color:var(--fg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:none;padding:8px 14px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.daytabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.daytab{flex:0 0 auto;text-align:left;display:flex;flex-direction:column;gap:0;padding:8px 14px;min-width:120px}
.daytab b{font-size:1.05rem;font-weight:700}
.daytab span{font-size:.75rem;color:var(--muted);font-weight:500}
.daytab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dayhead p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) 70px 90px 80px 34px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row .idx{font-family:var(--f-display);font-size:1.3rem;color:var(--muted);text-align:center}
.row .grp{font-size:.72rem;color:var(--muted);;margin-top:2px}
.colhead{display:grid;grid-template-columns:28px minmax(0,1fr) 70px 90px 80px 34px;gap:10px;font-size:.7rem;color:var(--muted);;font-weight:600;padding-bottom:6px}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow select{flex:1 1 220px;width:auto}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.vol{display:flex;flex-direction:column;gap:9px}
.vrow{display:grid;grid-template-columns:110px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:.85rem}
.bar{position:relative;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar .zone{position:absolute;top:0;bottom:0;background:var(--ok-soft);border-left:1px dashed var(--ok);border-right:1px dashed var(--ok)}
.bar i.in{background:var(--ok)}
.bar i.res{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 6px);border-radius:0 5px 5px 0;opacity:.8}
.legend{font-size:.78rem;color:var(--muted);margin-top:10px}
.tips{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:.88rem;display:flex;flex-direction:column;gap:6px}
/* sessão */
.ex{border-top:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:8px}
.ex .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ex .last{font-size:.8rem;color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:44px minmax(0,110px) minmax(0,110px) auto;gap:8px;align-items:center}
.set .lbl{font-family:var(--f-display);font-size:1.05rem;color:var(--muted)}
.chk{width:auto;padding:7px 12px}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done input{border-color:var(--ok)}
.progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--ok);transition:width .25s}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer .t{font-family:var(--f-mono);font-size:1.6rem}
.hist{display:flex;flex-direction:column}
.hitem{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.hitem .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hitem ul{margin:2px 0 0;padding-left:18px;color:var(--muted);font-size:.86rem}
.empty{color:var(--muted);padding:18px 0}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.note{font-size:.8rem;color:var(--muted)}
@media (max-width:760px){
  .grid2{grid-template-columns:1fr}
  .colhead{display:none}
  .row{grid-template-columns:24px minmax(0,1fr) 34px;grid-template-areas:"i n x" ". s s"}
  .row .idx{grid-area:i}.row .name{grid-area:n}.row .del{grid-area:x}
  .row .meta{grid-area:s;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  h1{font-size:2rem}
}
@media (min-width:761px){.row .meta{display:contents}}
.meta label{display:contents}
.meta .ml{display:none}
@media (max-width:760px){.meta label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);}.meta .ml{display:inline}}
.exbtn{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;padding:4px;text-align:left;width:100%;font-weight:600;min-width:0}
.exbtn:hover{border-color:var(--line);background:var(--surface-2)}
.exbtn .nm{min-width:0}
.exbtn small{display:block;font-weight:500;font-size:.7rem;color:var(--muted);}
.exbtn small b{color:var(--accent);font-weight:600}
.thumb{width:68px;flex:0 0 68px;aspect-ratio:160/130;background:var(--surface-2);border-radius:6px;display:block}
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:980px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;display:flex;flex-direction:column;gap:14px;
  padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:761px){.modal{align-items:center;padding:24px}.sheet{border-radius:14px;max-height:88vh;padding:22px}}
.pkhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.card.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card canvas{width:100%;aspect-ratio:160/130;background:var(--surface-2);border-radius:8px;display:block}
.card h3{font-size:1.1rem}
.card .meta2{font-size:.72rem;color:var(--muted);;margin-top:-4px}
.cues{margin:0;padding-left:18px;font-size:.83rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.card .cues{flex:1}
.exvis{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.exvis canvas{width:100%;aspect-ratio:160/130;background:var(--surface-2);border-radius:8px;display:block}
@media (max-width:480px){.exvis{grid-template-columns:110px minmax(0,1fr)}}
.sugcard{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.suglist{margin:6px 0 4px;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:520px}
.suglist li span:last-child{float:right;color:var(--muted)}
button.big{font-size:1rem;padding:12px 18px;align-self:flex-start}
.cfgbox summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cfgbox summary::-webkit-details-marker{display:none}
.cfgbox[open] summary{margin-bottom:14px}
.cfgbox .cfgedit{margin-left:auto;font-size:.85rem;font-weight:600;color:var(--accent)}
.cfgbox[open] .cfgedit,.cfgbox[open] #cfgSum{display:none}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-size:1.7rem}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.who-chip{display:flex;align-items:baseline;gap:8px;border-radius:999px;padding:6px 14px;font-size:.95rem}
.who-chip .chev{font-size:.75rem;color:var(--accent);font-weight:600}
.sync{font-size:.72rem}
/* barra inferior no estilo do portal Aura (como a do WhatsApp): fixa, translúcida, ícone + nome, aba ativa em destaque */
.tabbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;
  display:grid;grid-template-columns:repeat(4,1fr);background:rgba(30,30,30,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.08);border-radius:26px;padding:6px 6px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.tabbar .tab{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font-weight:600;font-size:11.5px;padding:6px 0;border-radius:12px}
.tabbar .tab svg{width:23px;height:23px;padding:4px 18px;box-sizing:content-box;border-radius:999px;transition:background .2s}
.tabbar .tab[aria-selected="true"]{color:var(--fg)}
.tabbar .tab[aria-selected="true"] svg{background:var(--accent-soft);color:var(--accent);stroke:var(--accent)}
#cfgBox{order:-1}
@media (min-width:820px){ .tabbar{left:50%;right:auto;transform:translateX(-50%);width:480px;bottom:14px} }
.home{display:flex;flex-direction:column;gap:16px}
.others2{display:flex;flex-direction:column;gap:10px}
.prog{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.progsum{background:var(--surface);border-radius:16px;padding:12px 14px}
.proglist{display:flex;flex-direction:column;gap:8px}
.progrow{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px}
.pgname{display:flex;flex-direction:column;min-width:0}
.pgname b{font-size:.95rem;line-height:1.2}
.pgname small{color:var(--muted);font-size:.76rem}
.spark{width:96px;height:30px;display:block}
.pgval{display:flex;flex-direction:column;align-items:flex-end;text-align:right}

.msnum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.othrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}

.othcard{flex:0 0 46%;max-width:200px;scroll-snap-align:start;display:flex;flex-direction:column;gap:0;padding:0;border:none;border-radius:18px;background:var(--surface);overflow:hidden;text-align:left}

.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);padding:10px 12px;font-weight:600}

/* ---- Anilhas: cada série (ou treino da semana) feita entra na barra ---- */
.plates{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 26px;min-width:150px}

.plates i.new{animation:platein .45s cubic-bezier(.2,1.4,.4,1)}

.plates.sm::before{height:3px;margin-top:-1.5px}

.smoke i{position:absolute;border-radius:50%}
.smoke i:nth-child(1){width:min(150vw,720px);height:min(150vw,720px);right:max(-65vw,-310px);top:max(-52vw,-250px);background:radial-gradient(closest-side,rgba(255,117,31,.58),rgba(255,117,31,0))}
.smoke i:nth-child(2){width:min(140vw,680px);height:min(140vw,680px);left:max(-80vw,-380px);top:26vh;background:radial-gradient(closest-side,rgba(245,243,238,.13),rgba(245,243,238,0))}
.smoke i:nth-child(3){width:min(170vw,820px);height:min(130vw,640px);right:max(-95vw,-460px);bottom:max(-40vw,-200px);background:radial-gradient(closest-side,rgba(255,117,31,.26),rgba(255,117,31,0))}
.smoke.soft{opacity:.42}
.wrap{position:relative;z-index:1}
.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%)}
.tabbar{background:rgba(26,26,26,.58);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);border-color:rgba(255,255,255,.1)}
.sheet2{background:rgba(32,32,32,.8);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);border-top:1px solid rgba(255,255,255,.1)}
.panel,.hcard,.wkcard,.backup,.progrow,.progsum,.myrow,.msum,.mrow,.othcard,.addex,.namefield,.mempty,.btips{background:rgba(255,255,255,.06)}
.hero::after{display:none}
.hero img{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 54%,transparent 97%);mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 54%,transparent 97%)}
.cbody{margin-top:-92px}
.weekcard{border-radius:18px;padding:12px 14px;margin-top:4px;flex-wrap:nowrap}
.weekcard .streak{text-align:right;line-height:1.15;font-size:.88rem}
.home2 .cover .pbtn{box-shadow:0 14px 40px rgba(255,117,31,.32)}
/* ---- Perfil ---- */
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.avatar.big{width:108px;height:108px;font-size:2.6rem;box-shadow:0 0 0 3px #1c1c1c,0 0 0 6px var(--accent)}
.profbtn{display:flex;align-items:center;gap:12px;background:none;border:none;padding:4px;margin:-4px;text-align:left;min-width:0;border-radius:16px}
.profbtn .avatar{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--surface-2);font-weight:700;font-size:1.2rem}
.profbtn .hi{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.profbtn .hi small{color:var(--muted);font-size:.88rem;font-weight:500}
.profbtn .hi b{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{flex-direction:row;align-items:center}
.hdrlogo{height:22px;margin:0}
.scrim2{position:fixed;inset:0;z-index:70;background:rgba(10,10,10,.5)}
.pfsheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:560px;margin-inline:auto;max-height:92vh;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;border-radius:30px 30px 0 0;
  background:rgba(34,34,34,.72);border-top:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);

.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin-bottom:8px}
.pfphoto{position:relative;background:none;border:none;padding:6px;border-radius:50%}
.pfphoto .avatar{display:grid;place-items:center;border-radius:50%;background:var(--surface-2);font-weight:800}
.pfphoto .cam{position:absolute;right:2px;bottom:4px;width:36px;height:36px;border-radius:50%;background:var(--fg);color:#141414;display:grid;place-items:center;box-shadow:0 0 0 3px #222}
.pfrm{align-self:center;color:var(--muted);font-size:.9rem}
.glassrow{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:16px}
.pfname{width:100%;display:flex;flex-direction:column;gap:0;padding:10px 16px}
.pfname span{color:var(--muted);font-size:.8rem;font-weight:500}
.pfname input{background:none;border:none;padding:2px 0;font-size:1.2rem;font-weight:700;color:var(--fg)}
.pfname input:focus{outline:none}
.pfname:focus-within{border-color:var(--accent)}
.pfnums{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pfnums div{display:flex;flex-direction:column;padding:10px 14px}
.pfnums b{font-size:1.6rem;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.pfnums b.o{color:var(--accent)}
.pfnums span{font-size:.78rem;color:var(--muted)}
.pfrow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;font-size:1rem;font-weight:600;color:var(--fg);text-align:left}
.pfrow span:last-child{color:var(--muted);font-weight:500;text-align:right;white-space:nowrap}
.pfrow .ic{color:var(--muted)}
/* ---- Entrar na conta ---- */
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:16px;border:none;background:var(--fg);color:#141414;font-weight:700;font-size:1.05rem}
.who-btns .gbtn{justify-content:center;background:var(--fg);color:#141414;font-size:1.05rem}

.lsep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem;margin:6px 0}
.lsep::before,.lsep::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.12)}
#lform{display:flex;flex-direction:column;gap:10px}
.lfield{display:flex;flex-direction:column;padding:10px 16px}
.lfield span{color:var(--muted);font-size:.8rem;font-weight:500}
.lfield input{background:none;border:none;padding:2px 0;font-size:1.1rem;font-weight:600;color:var(--fg);border-radius:0}

.who-btns #lform .lsec{background:rgba(255,255,255,.08);font-size:1.05rem;margin-top:0}
.who-btns #lform .lreset{background:none;color:var(--muted);font-size:.95rem;font-weight:500;padding:6px;align-self:center;width:auto}
.lmsg{margin:0;min-height:1.3em;color:#ff8a7a}
.lfoot{margin:8px 0 0;text-align:center}
.loadacc{text-align:center;padding-top:20vh}
/* ---- Objetivo ---- */
#cfgBox{display:none!important}
.goal{display:flex;flex-direction:column;gap:22px;margin-bottom:8px}
.goal h3{font-size:1.05rem;margin-bottom:10px}
.goalintro h2{font-size:1.6rem;margin-bottom:6px}
.goalintro .note{margin:0;font-size:.95rem}
.optcards{display:flex;flex-direction:column;gap:8px}
.optcard{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid transparent;background:rgba(255,255,255,.06)}
.optcard b{display:block;font-size:1.05rem;font-weight:700}
.optcard small{color:var(--muted);font-size:.85rem;font-weight:500}
.optcard .tk{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #5a5a5a;display:grid;place-items:center;color:transparent}
.optcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.optcard[aria-pressed="true"] .tk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.pact{display:flex;gap:8px;flex-wrap:wrap}
.metabtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-size:.88rem}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  const CUES = {
    abddecl:["Prenda os pés no apoio do banco inclinado, mãos cruzadas no peito.","Suba o tronco enrolando a coluna, até ficar perto da vertical.","Desça devagar, sem deixar o tronco cair."],
    roscainc:["Sente no banco inclinado, braços pendurados atrás da linha do corpo.","Dobre os cotovelos sem tirá-los do lugar.","Desça até esticar bem: o alongamento é o ponto forte deste exercício."],
    roscainv:["Segure a barra com as palmas para baixo.","Suba dobrando os cotovelos, punhos firmes.","Desça devagar."],
    roscascotth:["Braço apoiado no banco Scott, um halter de cada vez.","Suba contraindo o bíceps.","Desça até quase estender, sem travar o cotovelo."],
    roscacorda:["De frente para a polia baixa, corda com as palmas viradas uma para a outra.","Suba dobrando os cotovelos, sem girar o punho.","Desça devagar."],
    roscadrag:["Barra encostada nas coxas.","Suba a barra arrastando-a rente ao corpo, levando os cotovelos para trás.","Desça pelo mesmo caminho."],
    supfechado:["Deitado, mãos na largura dos ombros.","Desça a barra até a parte de baixo do peito, cotovelos junto ao corpo.","Empurre até estender os braços."],
    tricepsov:["De costas para a polia alta, corda atrás da cabeça, tronco levemente inclinado.","Estenda os braços para a frente e para cima.","Volte devagar, cotovelos apontando para a frente."],
    testah:["Deitado, um halter em cada mão acima do peito, palmas viradas uma para a outra.","Dobre só os cotovelos levando os halteres ao lado da cabeça.","Estenda de volta sem mover os ombros."],
    pulleyuni:["Uma mão no pegador, palma para cima, cotovelo colado ao corpo.","Estenda o braço para baixo.","Volte devagar até 90°."],
    supdecl:["Deite no banco declinado com os pés presos.","Desça a barra até a parte de baixo do peito.","Empurre até estender os braços."],
    pullover:["Deite no banco segurando um halter com as duas mãos acima do peito.","Leve o halter para trás da cabeça com os cotovelos levemente dobrados.","Volte em arco até acima do peito."],
    remcurvh:["Incline o tronco à frente, coluna reta, joelhos levemente dobrados.","Puxe os halteres em direção ao quadril.","Desça devagar até esticar os braços."],
    terra:["Barra encostada na canela, pés na largura do quadril.","Empurre o chão e estenda quadril e joelhos juntos, barra rente ao corpo.","Desça com a mesma linha, coluna sempre reta."],
    puxadasup:["Segure a barra com as palmas para você, na largura dos ombros.","Puxe até o alto do peito, cotovelos para baixo.","Suba devagar até esticar os braços."],
    elevfront:["Em pé, halteres à frente das coxas.","Eleve os braços à frente até a altura dos ombros.","Desça devagar, sem balançar o tronco."],
    remalta:["Barra à frente das coxas, pegada um pouco mais fechada que os ombros.","Puxe a barra até o peito, cotovelos subindo para fora.","Desça devagar."],
    roscapolia:["Fique de frente para a polia baixa, cotovelos colados ao corpo.","Dobre os cotovelos trazendo a barra até o peito.","Desça devagar até esticar."],
    roscaconc:["Sentado, apoie o cotovelo na parte de dentro da coxa.","Dobre o cotovelo trazendo o halter até o ombro.","Desça devagar até esticar o braço."],
    coice:["Apoie mão e joelho no banco, tronco paralelo ao chão.","Com o braço colado ao corpo, estenda o cotovelo para trás.","Volte devagar até 90°."],
    pulleycorda:["Segure a corda com os cotovelos colados ao corpo.","Estenda os cotovelos abrindo a corda no final.","Volte devagar até 90°."],
    paralelas:["Apoie as mãos nas barras paralelas, braços estendidos.","Desça dobrando os cotovelos até cerca de 90°.","Empurre até estender os braços."],
    passada:["Halteres ao lado do corpo, tronco ereto.","Dê um passo à frente e desça até o joelho de trás quase tocar o chão.","Empurre com a perna da frente e volte."],
    sumo:["Pés bem afastados, pontas para fora, halter entre as pernas.","Desça com o tronco ereto, joelhos na direção dos pés.","Suba contraindo glúteos."],
    subida:["Pé inteiro apoiado no caixote, halteres ao lado do corpo.","Suba empurrando com a perna da frente, sem impulso da de trás.","Desça devagar."],
    coicepolia:["Tornozeleira na polia baixa, mãos apoiadas no aparelho.","Leve a perna para trás e para cima contraindo o glúteo.","Volte devagar, sem arquear a lombar."],
    escalador:["Posição de prancha alta, mãos sob os ombros.","Traga um joelho em direção ao peito.","Alterne as pernas mantendo o quadril baixo."],
    abdinfra:["Deite de costas, pernas estendidas, mãos ao lado do corpo.","Dobre os joelhos trazendo-os em direção ao peito.","Estenda devagar sem encostar os pés no chão."],
    supreto:["Deite com os olhos sob a barra e os pés firmes no chão.","Desça a barra até a linha do mamilo, cotovelos a cerca de 45° do corpo.","Empurre até estender os braços, sem tirar o quadril do banco."],
    supretoh:["Deite com um halter em cada mão, acima do peito.","Desça abrindo os cotovelos até sentir o peito alongar.","Empurre para cima aproximando os halteres no topo."],
    supinc:["Banco a 30–45°, costas e quadril apoiados.","Desça os halteres até a parte alta do peito.","Empurre para cima sem bater os halteres."],
    supincb:["Banco a 30–45°, pegada um pouco mais aberta que os ombros.","Desça a barra até a parte alta do peito.","Empurre até estender, ombros encaixados no banco."],
    chestm:["Ajuste o banco para as pegadas ficarem na altura do peito.","Empurre à frente até quase estender os cotovelos.","Volte devagar, sem deixar o peso encostar."],
    cruci:["Deite com os halteres acima do peito, cotovelos levemente dobrados.","Abra os braços em arco até sentir o peito alongar.","Feche pelo mesmo caminho, como se abraçasse uma árvore."],
    cross:["Polias no alto, um passo à frente, tronco levemente inclinado.","Traga as mãos para baixo e para o centro, em arco.","Volte devagar até sentir o peito alongar."],
    peck:["Costas no encosto, braços na altura dos ombros.","Feche os braços à frente contraindo o peito.","Abra devagar até a linha do corpo."],
    flex:["Mãos um pouco mais abertas que os ombros, corpo em linha reta.","Desça o peito até perto do chão.","Empurre o chão e suba sem deixar o quadril cair."],
    flexinc:["Pés num banco ou degrau, mãos no chão.","Desça o peito mantendo o corpo reto.","Empurre até estender os braços."],
    puxada:["Sente com as coxas presas sob o apoio, pegada aberta.","Puxe a barra até a parte alta do peito, levando os cotovelos para baixo.","Suba controlando até esticar os braços."],
    barra:["Pendure-se com as palmas para frente, mãos além da largura dos ombros.","Puxe até o queixo passar da barra.","Desça devagar até esticar os braços."],
    remcurv:["Joelhos levemente dobrados, tronco inclinado, coluna reta.","Puxe a barra em direção ao umbigo.","Desça controlando, sem arredondar as costas."],
    remuni:["Apoie a mão livre no banco, costas retas.","Puxe o halter em direção ao quadril, cotovelo junto ao corpo.","Desça até esticar o braço."],

let lsOk = true, writing = false, again = false;
function snapshot(){ const {cfg,plan,history,session,savedAt,playlist,mine,hojePick,perfil,novo} = state; return {cfg,plan,history,session,savedAt,playlist,mine,hojePick,perfil,novo}; }

function save(now){
  if(!profile) return;
  state.savedAt = Date.now();
  try{ localStorage.setItem(lsKey(profile), JSON.stringify(snapshot())); lsOk = true; }catch(e){ lsOk = false; }
  if(!dbRef){ syncEl.textContent = lsOk ? "Salvo neste aparelho" : "Atenção: este navegador não está guardando os dados"; return; }
  clearTimeout(saveT); syncEl.textContent = "Salvando…";
  if(now) pushDb(); else saveT = setTimeout(pushDb, 600);
}
async function pushDb(){
  clearTimeout(saveT); saveT = null;
  if(!dbRef) return;
  if(writing){ again = true; return; }
  writing = true;
  const ref = dbRef, body = {json:JSON.stringify(snapshot()), at:Date.now()};
  try{
    try{ await ref.set(body); }
    catch(e){
      if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r, 400+Math.random()*800)); await ref.set(body); }
      else throw e;
    }
    if(ref===dbRef) syncEl.textContent = `Salvo na sua conta às ${hhmm()}`;
  }catch(e){
    if(ref===dbRef) syncEl.textContent = `Não salvou na conta (${(e&&e.code)||"erro"})${lsOk?". Ficou salvo neste aparelho":""}`;
  }finally{
    writing = false;
    if(again){ again = false; pushDb(); }
  }
}
function flushSave(){ if(saveT) pushDb(); }

function load(obj){

  state.cfg = {...DEFAULT_CFG, ...(obj.cfg||{})};

  state.perfil = obj.perfil && typeof obj.perfil==="object" ? obj.perfil : {};

}

async function connect(){
  if(!window.claude?.use) return;
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const p = profile; if(!p) return;
    const ref = db.doc(`data/users/${id}/${p==="carlson"?"estado":"estado-"+p}`);
    const snap = await ref.get();
    if(profile!==p) return;
    dbRef = ref;
    let remote = null;
    if(snap.exists){ try{ remote = JSON.parse(snap.data().json); }catch(e){} }
    // Fica com a versão mais nova: a da conta ou a deste aparelho
    const localAt = state.savedAt || 0, remoteAt = (remote && remote.savedAt) || 0;
    const remoteWins = remote && (remoteAt || localAt ? remoteAt > localAt
      : ((remote.history||[]).length > state.history.length || ((remote.history||[]).length === state.history.length && !state.session && !!remote.session)));
    if(remoteWins){
      const wasNovo = !!state.novo;
      load(remote); if(state.session) state.view = "treinar"; else if(wasNovo && !state.novo && state.view==="objetivo") state.view = "treinar";
      applyHoje(); render();
      syncEl.textContent = "Salvo na sua conta";
    }else{
      save(true);
    }
  }catch(e){ /* segue só com o navegador */ }
}

// ---------- Evolução de carga por exercício (a partir do histórico) ----------
function progressData(){
  const by = {};
  for(const h of state.history){
    for(const en of (h.entries||[])){
      if(!BY[en.id] || !en.sets || !en.sets.length) continue;
      const kg = Math.max(0, ...en.sets.map(x=>toNum(x.kg)));
      const reps = Math.max(0, ...en.sets.map(x=>parseInt(x.reps)||0));
      (by[en.id] = by[en.id]||[]).push({d:h.date, kg, reps});
    }
  }
  return Object.entries(by).map(([id,pts])=>{
    pts.sort((a,b)=>String(a.d).localeCompare(String(b.d)));
    const useKg = pts.some(p=>p.kg>0), val = p=>useKg ? p.kg : p.reps;
    const first = val(pts[0]), last = val(pts[pts.length-1]), best = Math.max(...pts.map(val));
    return {id, pts, useKg, first, last, best, diff:last-first, pct:first ? (last-first)/first*100 : 0, lastDate:pts[pts.length-1].d};
  }).sort((a,b)=>String(b.lastDate).localeCompare(String(a.lastDate)));
}
function spark(pts, useKg){
  const v = pts.map(p=>useKg ? p.kg : p.reps), n = v.length, W2 = 96, H2 = 30;
  if(n<2) return `<svg class="spark" viewBox="0 0 ${W2} ${H2}" aria-hidden="true"><circle cx="${W2-4}" cy="${H2/2}" r="3" fill="var(--accent)"/></svg>`;
  const lo = Math.min(...v), hi = Math.max(...v), sp = hi-lo || 1;
  const xy = v.map((y,i)=>[4 + i*(W2-8)/(n-1), H2-4 - (y-lo)/sp*(H2-8)]);
  return `<svg class="spark" viewBox="0 0 ${W2} ${H2}" aria-hidden="true"><polyline points="${xy.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${xy[n-1][0]}" cy="${xy[n-1][1]}" r="3" fill="var(--accent)"/></svg>`;
}

}

function renderVolume(){
  const dir = Object.fromEntries(Object.keys(GROUPS).map(g=>[g,0])), res = {...dir};
  for(const d of state.plan.days) for(const it of d.items){
    const e = BY[it.id]; if(!e) continue; const n = +it.sets||0;
    dir[e.g] += n;
    for(const [g,k] of Object.entries(residual(e))) res[g] += n*k;
  }
  const [lo,hi] = DOSE[state.cfg.goal].zone;
  const tot = g=>dir[g]+res[g];
  const max = Math.max(18, ...Object.keys(GROUPS).map(tot));
  const fmt = n=>String(Math.round(n*2)/2).replace(".",",");
  const rows = Object.entries(GROUPS).map(([g,l])=>{
    const v = tot(g), minor = g==="adut";
    const zLo = minor?3:lo, zHi = minor?8:hi, inZone = v>=zLo && v<=zHi;
    return `<div class="vrow"><span>${l}</span>
      <div class="bar" role="img" aria-label="${l}: ${fmt(v)} séries, ${fmt(res[g])} de tabela"><span class="zone" style="left:${zLo/max*100}%;width:${(zHi-zLo)/max*100}%"></span><i class="${inZone?"in":""}" style="width:${v/max*100}%"></i><i class="res" style="left:${dir[g]/max*100}%;width:${res[g]/max*100}%"></i></div>
      <span class="num" style="text-align:right">${fmt(v)}</span></div>`;
  }).join("");
  return `<div class="vol" style="margin-top:12px">${rows}</div>
    <div class="legend">Faixa verde: ${lo} a ${hi} séries por semana. A parte listrada são séries que o músculo recebe de tabela em outros exercícios (a remada também trabalha o bíceps, o supino também trabalha o tríceps).</div>`;
}

function renderTips(){
  const g = state.cfg.goal;
  const t = {
    hip:["Chegue a 1–2 repetições da falha na última série.","Quando completar o topo da faixa de reps em todas as séries, suba a carga (2–5%)."],
    for:["Nos multiarticulares, descanse de 2 a 3 minutos.","Aumente a carga em 2,5 kg quando fizer todas as séries com a técnica limpa."],
    con:["Descanso curto mantém o coração acelerado. Combine com 20–30 min de cardio.","O resultado no peso vem da alimentação; o treino preserva a massa muscular."]
  }[g];
  return `<ul class="tips">${t.map(x=>`<li>${x}</li>`).join("")}<li>Aqueça com 1–2 séries leves antes do primeiro exercício.</li></ul>`;
}

function renderSession(){
  const s = state.session;
  if(!s || ui.min) return renderHome();
  const d = sessDay(s);
  if(s.phase==="done") return renderDone(s, d);
  const p = pos(s);
  if(!p){ s.phase = "done"; s.review = true; return renderDone(s, d); }
  if(s.phase==="rest") return renderRest(s, p);
  return renderSet(s, p);
}

// ---------- Execução: posição atual, valores já preenchidos ----------
function pos(s){
  let ei = (s.cur!=null && s.entries[s.cur] && s.entries[s.cur].sets.some(x=>!x.done)) ? s.cur : s.entries.findIndex(en=>en.sets.some(x=>!x.done));
  if(ei<0) return null;
  return {ei, si:s.entries[ei].sets.findIndex(x=>!x.done)};
}
function curIndex(s){ const p = pos(s); return p ? p.ei : -1; }
function draft(en, si){
  const st = en.sets[si];
  if(st.done || st.t) return st;
  const prev = en.sets.slice(0,si).reverse().find(x=>x.done);
  if(prev){ st.kg = prev.kg; st.reps = prev.reps; }
  else{
    if(!String(st.kg??"").trim()) st.kg = suggest(en.id, entryReps(en)).kg || "";
    if(!String(st.reps??"").trim()) st.reps = String(range(entryReps(en)).hi || "");
  }
  return st;
}
const restSec = en=>{ const r = String(en.rest||""); return /min/.test(r) ? parseFloat(r)*60 : (parseInt(r)||90); };
const kgStep = id=>BY[id]?.eq==="d" ? 2 : 2.5;
const icon = (d)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;

function renderRest(s, p){

  biceps:{"cabeça longa":["bayes","roscainc","roscadrag"], "cabeça curta":["scott","roscascotth","roscaconc"], "braquial (lateral do braço)":["martelo","roscacorda","roscainv"], "bíceps inteiro":["roscab","roscaalt","roscapolia","barrasup"]},
  triceps:{"cabeça longa":["frances","tricepsov","testa","testah"], "cabeça lateral":["pulley","pulleycorda","coice"], "cabeça medial":["pulleyuni"], "tríceps inteiro (multiarticular)":["supfechado","mergulho","flexdiam"]},
  quad:{"agachamento (multiarticular)":["agach","goblet","agachpc","hack","legpress","bulgaro","afundo","passada"], "isolado":["extensora"]},

  glut:{"extensão de quadril":["pelvica","ponte","subida","coicepolia"], "lateral (glúteo médio)":["abdutora"]},
  core:{"superior":["crunch","abdpolia","abddecl"], "inferior":["elevpern","abdinfra"], "estabilidade":["prancha","escalador"]},
  pant:{"em pé (gastrocnêmio)":["pantpe","pantuni"], "sentado (sóleo)":["pantsent"]},
  adut:{"adutores":["adutora","sumo"]}
};
const PART_OF = {}; for(const [g,ps] of Object.entries(PARTS)) for(const [pt,ids] of Object.entries(ps)) for(const id of ids) if(!PART_OF[id]) PART_OF[id] = pt;
const GROUP_NAME = g=>GROUPS[g].toLowerCase();
// Dicas ao montar: parte repetida 2+ vezes e partes que faltam nos músculos já escolhidos
function buildTips(items){
  const ids = items.map(it=>it.id), have = new Set(ids), eq = EQ_OK[state.cfg.equip], av = avoided(), out = [];
  const pick = (g, pt)=>(PARTS[g][pt]||[]).filter(id=>BY[id] && !have.has(id) && !av.has(id) && eq.includes(BY[id].eq)).slice(0,2);
  const groups = [...new Set(ids.map(id=>BY[id]?.g).filter(Boolean))];
  for(const g of groups){ if(!PARTS[g]) continue; let warned = false;
    for(const [pt,list] of Object.entries(PARTS[g])){
      const used = ids.filter(id=>list.includes(id));
      if(used.length>=2){ const other = Object.keys(PARTS[g]).filter(q=>q!==pt && !ids.some(id=>PARTS[g][q].includes(id)));
        const sug = other.flatMap(q=>pick(g,q)).slice(0,3);
        warned = true;
        out.push({warn:true, from:used[used.length-1], text:`${used.length} exercícios para a mesma parte de ${GROUP_NAME(g)} (${pt}): ${used.map(id=>BY[id].name).join(", ")}. Troque ${BY[used[used.length-1]].name} por outra parte:`, sug}); }
    }
    const miss = Object.keys(PARTS[g]).filter(pt=>!/inteiro|multiarticular|agachamento/.test(pt) && !ids.some(id=>PARTS[g][pt].includes(id)) && Object.keys(PARTS[g]).length>1);
    if(!warned && miss.length && miss.length < Object.keys(PARTS[g]).length){ const sug = miss.flatMap(pt=>pick(g,pt)).slice(0,3);
      if(sug.length) out.push({text:`Para completar ${GROUP_NAME(g)}, falta: ${miss.join(", ")}.`, sug}); }
  }
  return out;
}
function renderBuildTips(items){
  const t = buildTips(items); if(!t.length) return "";
  return `<div class="btips"><div class="eyebrow">Dicas para este treino</div>${t.map(x=>`<div class="tip${x.warn?" warn":""}"><p>${esc(x.text)}</p>${x.sug.length?`<div class="tipsug">${x.sug.map(id=>x.from ? `<button class="chip" data-act="swapsug" data-from="${x.from}" data-id="${id}">↔ ${esc(BY[id].name)}</button>` : `<button class="chip" data-act="addsug" data-id="${id}">+ ${esc(BY[id].name)}</button>`).join("")}</div>`:""}</div>`).join("")}</div>`;
}

const avoided = ()=>new Set(state.cfg.avoid||[]);
// famílias de movimento: dentro do mesmo músculo, as da mesma família aparecem primeiro
const FAM = {};
[["supreto","supretoh","supinc","supincb","supdecl","chestm","flex","flexinc","paralelas"],["cruci","cross","peck","pullover"],
 ["rembaixa","remcurv","remcurvh","remuni","cavalinho","remmesa"],["puxada","puxadasup","barra","barrasup","pulldown"],
 ["desenvh","desenvb","pike"],["elevlat","elevlatp","elevfront","remalta"],["crucinv","facepull","ytw"],
 ["roscab","roscaalt","martelo","scott","bayes","roscapolia","roscaconc","roscainc","roscainv","roscascotth","roscacorda","roscadrag"],["pulley","pulleycorda","coice","pulleyuni"],["frances","testa","testah","tricepsov"],["mergulho","flexdiam","paralelas","supfechado"],
 ["agach","goblet","agachpc","hack","legpress","sumo"],["bulgaro","afundo","passada","subida"],["terrarom","stiffh","terra","bancorom"],

].forEach((f,i)=>f.forEach(id=>{ (FAM[id] = FAM[id]||[]).push(i); }));
const sameFam = (a,b)=>(FAM[a]||[]).some(i=>(FAM[b]||[]).includes(i));
function similar(id, exclude=[], n=6){
  const cur = BY[id], ex = new Set([id,...exclude]), av = avoided();
  return EX.filter(e=>e.g===cur.g && !ex.has(e.id) && EQ_OK[state.cfg.equip].includes(e.eq))
    .map(e=>({e, score:(sameFam(id,e.id)?5:0) + (e.comp===cur.comp?3:0) + (e.eq===cur.eq?1:0) - (av.has(e.id)?10:0)}))
    .sort((a,b)=>b.score-a.score).slice(0,n).map(x=>x.e);
}

}

// Substitutos para quando o aparelho está ocupado: mesmo músculo, de preferência outro equipamento
function alternatives(en, s){
  const cur = BY[en.id], taken = new Set(s.entries.map(x=>x.id));
  const av = avoided();
  return EX.filter(e=>e.g===cur.g && !taken.has(e.id) && EQ_OK[state.cfg.equip].includes(e.eq))
    .map(e=>({e, score:(e.comp===cur.comp?3:0) + (e.eq!==cur.eq?2:0) + (e.eq==="d"||e.eq==="c"?1:0) - (av.has(e.id)?10:0)}))
    .sort((a,b)=>b.score-a.score).slice(0,3).map(x=>x.e);
}

function groupSets(sets){

  return g.map(x=>`${x.n} × ${x.reps||"–"}${toNum(x.kg)?` · ${fmtKg(toNum(x.kg))} kg`:""}`).join("  +  ");

function readPhoto(file){
  return new Promise((res, rej)=>{ const url = URL.createObjectURL(file), im = new Image();

// ---------- Semana: treinos feitos, sequência e séries por músculo ----------
const dayKey = d=>{ const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; };
function weekStart(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
// A semana vai de segunda a domingo. A sequência conta semanas seguidas com a meta de treinos cumprida;
// a semana atual entra quando a meta já foi batida e não quebra a sequência enquanto está em andamento.
function weekStats(){
  const goal = Math.max(1, +state.cfg.days||3), byWeek = {};
  for(const h of state.history){ const k = dayKey(weekStart(h.date)); (byWeek[k] = byWeek[k]||new Set()).add(dayKey(h.date)); }
  const n = d=>{ const s = byWeek[dayKey(d)]; return s ? s.size : 0; };
  const w = weekStart(new Date()), done = n(w);
  let streak = done>=goal ? 1 : 0;
  for(let i=0;i<520;i++){ w.setDate(w.getDate()-7); if(n(w)>=goal) streak++; else break; }
  return {goal, done, streak};
}
const weeksTxt = n=>`${n} semana${n>1?"s":""} seguida${n>1?"s":""}`;
function weekPlates(w, sm){
  return `<div class="plates${sm?" sm":""}" role="img" aria-label="${w.done} de ${w.goal} treinos nesta semana">${Array.from({length:Math.max(w.goal, w.done)},(_,i)=>`<i class="${i<w.done?"d":""}"></i>`).join("")}</div>`;
}
function weekRow(){
  const w = weekStats();
  return `<div class="week weekcard glass">${weekPlates(w, true)}<span><b>${w.done} de ${w.goal}</b> ${w.streak>=2?"na semana":"treinos na semana"}</span>${w.streak>=2?`<span class="streak">${w.streak} semana${w.streak>1?"s":""}<br>seguida${w.streak>1?"s":""}</span>`:""}</div>`;
}
function weekVolume(){
  const v = Object.fromEntries(Object.keys(GROUPS).map(g=>[g,0])), from = weekStart(new Date());
  for(const h of state.history){
    if(new Date(h.date) < from) continue;
    for(const en of (h.entries||[])){ const e = BY[en.id]; if(!e) continue; const n = en.sets.length;
      v[e.g] += n; for(const [g,k] of Object.entries(residual(e))) v[g] += n*k; }
  }
  return v;
}

const worked = x=>toNum(x.kg)||toNum(x.reps);
function priorSets(id){ const out = []; for(const h of state.history) for(const en of (h.entries||[])) if(en.id===id) for(const x of en.sets) if(worked(x)) out.push(x); return out; }
// Recorde: carga maior do que todas as anteriores, ou mais repetições com a maior carga já usada.
function recordOf(prior, kg, reps){
  kg = toNum(kg); reps = toNum(reps);
  if(!prior.length || !reps) return null;
  const maxKg = Math.max(0, ...prior.map(x=>toNum(x.kg)));
  if(kg>maxKg) return "kg";
  if(kg===maxKg && reps>Math.max(0, ...prior.filter(x=>toNum(x.kg)>=kg).map(x=>toNum(x.reps)))) return "reps";
  return null;
}
const setTxt = x=>`${toNum(x.kg)?`${fmtKg(toNum(x.kg))} kg × `:""}${esc(x.reps)}${toNum(x.kg)?"":" reps"}`;
// Recordes de cada treino do histórico, na ordem em que aconteceram (vale também para treinos antigos).
function histRecords(){
  const seen = {}, out = [];
  const order = state.history.map((h,i)=>({h,i})).sort((a,b)=>String(a.h.date).localeCompare(String(b.h.date)));
  for(const {h,i} of order){
    const recs = [];
    for(const en of (h.entries||[])){
      const prior = seen[en.id] = seen[en.id]||[], had = prior.length>0; let best = null;
      for(const x of en.sets){ if(!worked(x)) continue; if(had && recordOf(prior, x.kg, x.reps)) best = {id:en.id, kg:x.kg, reps:x.reps}; prior.push(x); }
      if(best) recs.push(best);
    }
    out[i] = recs;
  }
  return out;
}
const sessRecords = s=>s.entries.map(en=>{ const x = en.sets.filter(x=>x.done && x.pr).pop(); return x ? {id:en.id, kg:x.kg, reps:x.reps} : null; }).filter(Boolean);

// ---------- Calculadora de anilhas (exercícios com barra) ----------
const PLATES = [25,20,15,10,5,2.5,1.25], BARS = [20,15,10,8], PLATE_H = {25:76,20:70,15:60,10:50,5:38,2.5:30,1.25:24};

const barOf = id=>(state.cfg.bars && state.cfg.bars[id]) || 20;
function platesFor(total, bar){
  let side = (total-bar)/2; if(side<0) return null;
  const out = [];
  for(const p of PLATES) while(side>=p-1e-9){ out.push(p); side -= p; }
  return {out, rest:Math.round(side*200)/100};
}

async function drawShare(h, recs){

    for(const w of words){ const tr = cur ? cur+" "+w : w; if(x.measureText(tr).width>max && cur){ lines.push(cur); cur = w; } else cur = tr; }
    lines.push(cur); return lines; };
  let lines = wrap(title, W-2*P);
  while((lines.length>2 || lines.some(l=>x.measureText(l).width>W-2*P)) && size>72){ size -= 8; font(800, size); lines = wrap(title, W-2*P); }
  lines = lines.slice(0,2);

    x.fillStyle = AC; font(800, 54); x.fillText(recs.length>1 ? `${recs.length} recordes` : "Novo recorde", P, y); y += 70;
    for(const r of recs.slice(0, lines.length>1 ? 2 : 3)){

      font(600, 42); let nm = BY[r.id]?.name || r.id; while(x.measureText(nm).width>W-2*P-vw-40 && nm.length>4) nm = nm.slice(0,-2).trimEnd()+"…";

// ---------- Progressão: sugere a carga de hoje a partir da última sessão ----------
const toNum = v=>parseFloat(String(v).replace(",","."))||0;
const fmtKg = n=>(Math.round(n*100)/100).toLocaleString("pt-BR");
function range(txt){ const n = String(txt||"").match(/\d+/g)||[]; const lo = +n[0]||0; return {lo, hi:+(n[1]||n[0])||0}; }
function entryReps(en){ return en.reps || String(en.target||"").split("×")[1] || ""; }
function lastEntry(id){
  for(let i=state.history.length-1;i>=0;i--){
    const e = state.history[i].entries.find(x=>x.id===id);
    if(e && e.sets.some(s=>toNum(s.kg)||toNum(s.reps))) return {date:state.history[i].date, sets:e.sets};
  }
  return null;
}
function suggest(id, repsTxt){
  const {hi} = range(repsTxt), L = lastEntry(id);
  if(!L) return {kg:"", hint:"", up:false};
  const work = L.sets.filter(s=>toNum(s.kg)||toNum(s.reps));
  const kg = Math.max(0, ...work.map(s=>toNum(s.kg)));
  const hitAll = hi>0 && work.length>0 && work.every(s=>toNum(s.reps)>=hi);
  if(!kg) return hitAll ? {kg:"", up:true, hint:`Você fez ${hi} reps em todas as séries. Hoje tente ${hi+2}.`} : {kg:"", up:false, hint:""};
  if(hitAll){
    const inc = BY[id]?.eq==="d" ? 2 : 2.5, nk = kg+inc;
    return {kg:fmtKg(nk), up:true, hint:`Suba para ${fmtKg(nk)} kg. Da última vez você fez ${hi} reps em todas as séries com ${fmtKg(kg)} kg.`};
  }
  return {kg:fmtKg(kg), up:false, hint:hi?`Mantenha ${fmtKg(kg)} kg até fazer ${hi} reps em todas as séries.`:""};
}
function freshSets(id, repsTxt, n){ const sg = suggest(id, repsTxt); return Array.from({length:n||1},()=>({kg:sg.kg, reps:"", done:false})); }

function startSug(){
  const sg = state.sug; if(!sg) return;
  state.session = {day:-1, sugId:sg.id, custom:{name:sg.titulo||"Treino de hoje", type:"do seu personal", items:sg.itens},
    started:new Date().toISOString(), entries:sg.itens.map(it=>({
      id:it.id, rest:it.rest||"90s", reps:it.reps, target:`${it.sets} × ${it.reps}`, sets:freshSets(it.id, it.reps, +it.sets)
    }))};
  state.view = "treinar"; save(); render(); window.scrollTo({top:0});
}
function startSession(i){
  const d = state.plan.days[i];
  state.session = {day:i, started:new Date().toISOString(), entries:d.items.map(it=>({
    id:it.id, rest:it.rest, reps:it.reps, target:`${it.sets} × ${it.reps}`, sets:freshSets(it.id, it.reps, +it.sets)
  }))};
  state.view = "treinar"; save(); render(); window.scrollTo({top:0});
}
let audioCtx = null, wake = null;
function unlockAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function beep(){
  try{ if(!audioCtx) return; const t0 = audioCtx.currentTime;
    [0,.25,.5].forEach((d,i)=>{ const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = i===2?1175:880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.0001,t0+d); g.gain.exponentialRampToValueAtTime(.4,t0+d+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+d+.18);
      o.start(t0+d); o.stop(t0+d+.2); });
  }catch(e){}
}
const mmss = n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`;
function tick(){
  const s = state.session;
  if(!s || s.phase!=="rest"){ stopTimer(); return; }
  const left = Math.max(0, Math.ceil((s.restUntil-Date.now())/1000));
  const el = $("#restT"); if(el) el.textContent = mmss(left);
  const ring = $("#ringP"); if(ring){ const C = 2*Math.PI*88; ring.setAttribute("stroke-dashoffset", (C*(1-left/(s.restTotal||90))).toFixed(1)); }
  if(left<=0){
    stopTimer(); beep();
    try{ navigator.vibrate && navigator.vibrate([250,120,250,120,400]); }catch(e){}
    s.phase = "set"; save(); render();
  }
}
function ensureTick(){ clearInterval(timer); timer = setInterval(tick, 250); }
function startTimer(){}
function stopTimer(){ clearInterval(timer); timer = null; }
document.addEventListener("pointerdown", unlockAudio, {passive:true});
async function syncWake(){
  const want = state.view==="treinar" && !!state.session && document.visibilityState==="visible";
  try{
    if(want && !wake && navigator.wakeLock){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", ()=>{ wake = null; }); }
    else if(!want && wake){ await wake.release(); wake = null; }
  }catch(e){ wake = null; }
}
document.addEventListener("visibilitychange", syncWake);

async function fbBoot(){
  let cached = null; try{ cached = JSON.parse(localStorage.getItem(ACC_KEY)||"null"); }catch(e){}
  if(cached && cached.uid) enterAccount(cached); else showLogin();     // entra na hora com o que está no aparelho; a conta confirma em seguida
  try{
    await loadScript(FB_SDK+"app-compat.js");
    await Promise.all([loadScript(FB_SDK+"auth-compat.js"), loadScript(FB_SDK+"firestore-compat.js")]);
    firebase.initializeApp(FB_CFG);
    fb.auth = firebase.auth(); fb.db = firebase.firestore();
    try{ await fb.db.enablePersistence({synchronizeTabs:true}); }catch(e){}
    fb.auth.languageCode = "pt-BR";
    fb.auth.onAuthStateChanged(u=>{
      fb.ready = true; fb.user = u;
      if(u) enterAccount(accOf(u));
      else { try{ localStorage.removeItem(ACC_KEY); }catch(e){} fb.acc = null; showLogin(); }
    });
  }catch(e){ fb.failed = true; if(ui.loadingAcc){ ui.loadingAcc = false; render(); } if(!profile) showLogin(); }
}
window.addEventListener("online", ()=>{ if(FB_ON && profile && !dbRef) fbConnect(); });
// Busca os dados da conta. Fica com a versão mais nova entre a conta e o aparelho.
async function fbConnect(){
  const p = profile;
  if(!fb.db || !fb.user || p!==fb.user.uid){ if(ui.loadingAcc && (fb.failed || !navigator.onLine)){ ui.loadingAcc = false; render(); } return; }
  try{
    const ref = fb.db.collection("usuarios").doc(p), snap = await ref.get();
    if(profile!==p) return;
    dbRef = ref;
    let remote = null;
    if(snap.exists){ try{ remote = JSON.parse(snap.data().json); }catch(e){} }
    const localAt = state.savedAt||0, remoteAt = (remote && remote.savedAt)||0;
    if(remote && (ui.loadingAcc || remoteAt>localAt)){
      const wasNovo = !!state.novo;
      load(remote); if(!state.plan) state.plan = generate(state.cfg);
      try{ localStorage.setItem(lsKey(p), JSON.stringify(snapshot())); }catch(e){}
      if(state.session){ state.view = "treinar"; if(state.session.phase==="rest") ensureTick(); }
      else if(wasNovo && !state.novo && state.view==="objetivo") state.view = "treinar";
      syncEl.textContent = "Salvo na sua conta";
    }
    else if(state.savedAt) save(true);
  }catch(e){ /* sem conexão: segue com o que está no aparelho */ }
  finally{ if(profile===p){ ui.loadingAcc = false; render(); } }
}

async function loginDo(kind){
  const msg = t=>{ const el = $("#lmsg"); if(el) el.textContent = t||""; };
  if(!fb.auth){ msg(fb.failed || !navigator.onLine ? "Sem conexão com a internet. O login precisa de internet." : "Carregando, tente de novo em instantes."); return; }
  const email = ($("#lemail")?.value||"").trim(), pass = $("#lpass")?.value||"";
  msg("");
  try{
    if(kind==="google") await fb.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    else if(kind==="reset"){ if(!email){ msg("Digite seu e-mail acima e toque de novo em Esqueci a senha."); return; }
      await fb.auth.sendPasswordResetEmail(email); msg("Enviei um link para você criar uma senha nova. Confira seu e-mail."); }
    else{
      if(!email){ msg("Digite seu e-mail."); return; }
      if(!pass){ msg("Digite a senha."); return; }
      if(kind==="new") await fb.auth.createUserWithEmailAndPassword(email, pass);
      else await fb.auth.signInWithEmailAndPassword(email, pass);
    }
  }catch(e){ const t = FB_ERR[e && e.code]; msg(t!==undefined ? t : "Não deu para entrar agora. Tente de novo."); }
}

  showLogin();
}

function initProfile(p){
  if(!PROFILES[p]) return;
  profile = p;
  try{ localStorage.setItem("montador-perfil", p); }catch(e){}
  clearTimeout(saveT); dbRef = null; stopTimer();
  state = {cfg:{...DEFAULT_CFG, ...PROFILES[p].cfg}, plan:null, history:[], session:null, view:"treinar", day:0, mine:[], hojePick:null, playlist:"", perfil:{}};
  let had = false;
  try{ had = load(JSON.parse(localStorage.getItem(lsKey(p))||"null")); }catch(e){}
  if(!state.plan) state.plan = generate(state.cfg);
  $("#cfgBox").open = !had && !(HOJE[p] && HOJE.data===todayStr());
  if(state.session){ state.view = "treinar"; if(state.session.phase==="rest") ensureTick(); }
  Object.assign(ui, {min:false, list:false, nota:false, pledit:false, planSub:null, draft:null, editIdx:null, cat:null, hopen:null, bkpend:null, bkmsg:"", prof:false, cfgDraft:null, genAsk:false});
  applyHoje();
  // Primeira vez neste perfil: abre em Objetivo para a pessoa configurar o plano (a não ser que o personal já tenha mandado o treino de hoje).
  if(!had) state.novo = true;
  if(state.novo && !state.session && !state.sug) state.view = "objetivo";
  $("#who").hidden = true; $("#app").hidden = false; $("#whoNow").hidden = false; $("header.top").hidden = false;
  syncEl.textContent = "";
  ui.loadingAcc = FB_ON && !had && navigator.onLine && !fb.failed;
  render();
  if(FB_ON) fbConnect(); else connect();
}

}

(function boot(){
  if(FB_ON){ fbBoot(); return; }
  let p = fromHash();
  if(!p){ try{ p = localStorage.getItem("montador-perfil"); }catch(e){} }

})();
